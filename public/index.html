<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Time Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.tailwindcss.min.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-gray-100">
    <div id="app" class="min-h-screen">
        <!-- Header -->
        <header id="header" class="bg-blue-600 text-white shadow-lg">
            <div class="container mx-auto px-4 py-3 flex items-center justify-between">
                <h1 class="text-xl font-bold">Ice Time Management</h1>
                <div id="user-menu" class="hidden">
                    <span id="user-name" class="mr-4"></span>
                    <button id="logout-btn" class="bg-blue-500 hover:bg-blue-700 px-3 py-1 rounded">Logout</button>
                </div>
                <button id="header-toggle" class="lg:hidden">☰</button>
            </div>
        </header>

        <div class="flex">
            <!-- Sidebar -->
            <aside id="sidebar" class="bg-gray-800 text-white w-64 min-h-screen transform -translate-x-full transition-transform lg:translate-x-0">
                <nav class="p-4">
                    <ul id="nav-menu" class="space-y-2">
                        <!-- Navigation items will be populated by JS based on user role -->
                    </ul>
                </nav>
            </aside>

            <!-- Main Content -->
            <main id="main-content" class="flex-1 p-6">
                <!-- Login Form (shown when not authenticated) -->
                <div id="login-form" class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
                    <form id="login">
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email</label>
                            <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" 
                                   id="email" type="email" required>
                        </div>
                        <div class="mb-6">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                            <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" 
                                   id="password" type="password" required>
                        </div>
                        <button class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg" 
                                type="submit">Login</button>
                    </form>
                    <p class="mt-4 text-center">
                        <a href="#" id="show-register" class="text-blue-500 hover:underline">Need an account? Register</a>
                    </p>
                </div>

                <!-- Registration Form (hidden by default) -->
                <div id="register-form" class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6 hidden">
                    <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>
                    <form id="register">
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="reg-name">Full Name</label>
                            <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" 
                                   id="reg-name" type="text" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="reg-email">Email</label>
                            <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" 
                                   id="reg-email" type="email" required>
                        </div>
                        <div class="mb-6">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="reg-password">Password</label>
                            <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" 
                                   id="reg-password" type="password" required>
                        </div>
                        <button class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg" 
                                type="submit">Register</button>
                    </form>
                    <p class="mt-4 text-center">
                        <a href="#" id="show-login" class="text-blue-500 hover:underline">Already have an account? Login</a>
                    </p>
                </div>

                <!-- Dashboard (shown after login) -->
                <div id="dashboard" class="hidden">
                    <h2 class="text-2xl font-bold mb-6">Dashboard</h2>
                    <div id="dashboard-content">
                        <!-- Dashboard content will be populated based on user role -->
                    </div>
                </div>
            </main>
        </div>

        <!-- Footer -->
        <footer id="footer" class="bg-gray-800 text-white p-4 text-center">
            <p>&copy; 2024 Ice Time Management System</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.tailwindcss.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
